<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title data-i18n="tabDisposer">Tab Disposer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            width: 480px;
            height: 720px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 0;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            overflow: hidden;
        }

        .container {
            padding: 12px;
            height: 100%;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .section {
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            transition: all 0.3s ease;
        }

        .section:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

	        .section-title {
	            font-weight: 600;
	            margin-bottom: 10px;
	            color: #2d3748;
	            display: flex;
	            align-items: center;
	            flex-wrap: wrap;
	            font-size: 14px;
	            letter-spacing: -0.025em;
	        }

	        .section-title i {
	            margin-right: 6px;
	            color: #667eea;
	            font-size: 16px;
	        }
	
	        .section-subtitle {
	            font-size: 10px;
	            font-weight: 400;
	            color: #718096;
	            margin-left: 6px;
	        }

        .button-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .button-row.single {
            grid-template-columns: 1fr;
        }

        button {
            padding: 8px 12px;
            border: none;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            position: relative;
            overflow: hidden;
            font-family: inherit;
            letter-spacing: -0.025em;
            text-overflow: ellipsis;
            min-height: 36px;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        button.secondary:hover {
            box-shadow: 0 8px 25px rgba(240, 147, 251, 0.4);
        }

        button.danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
        }

        button.danger:hover {
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
        }

        button.success {
            background: linear-gradient(135deg, #51cf66 0%, #40c057 100%);
        }

        button.success:hover {
            box-shadow: 0 8px 25px rgba(81, 207, 102, 0.4);
        }

        input[type="text"], input[type="number"] {
            padding: 8px 12px;
            border: 2px solid rgba(102, 126, 234, 0.2);
            border-radius: 8px;
            font-size: 12px;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: white;
        }

        input[type="text"] {
            width: 100%;
        }

        input[type="number"] {
            width: 120px;
            text-align: center;
            font-weight: 500;
        }

        /* Hide number input spinners */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        .input-group {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .input-group button {
            padding: 8px 12px;
            min-width: 36px;
            flex-shrink: 0;
        }

	        .input-group .input-label {
	            flex-shrink: 0;
	            min-width: auto;
	        }
	
	        .input-group label.input-label {
	            flex: 1 1 100%;
	        }
	
	        .input-unit {
	            opacity: 0.85;
	        }

        .input-label {
            font-size: 11px;
            font-weight: 500;
            color: #4a5568;
            margin-bottom: 0;
            display: inline-block;
            white-space: nowrap;
        }

        #message {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            padding: 16px 20px;
            background: linear-gradient(135deg, #51cf66 0%, #40c057 100%);
            color: white;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            z-index: 1000;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        #message.show {
            opacity: 1;
            transform: translateY(0);
        }

        #message.error {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
        }

        #message i {
            margin-right: 8px;
        }

        .info-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            font-size: 11px;
            color: #4a5568;
            border: 1px solid rgba(102, 126, 234, 0.2);
        }

        .info-card p {
            margin: 4px 0;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #2d3748;
            font-weight: 500;
        }

        .info-card ul {
            margin: 4px 0 6px;
            padding-left: 16px;
            list-style-type: disc;
            list-style-position: outside;
        }

        .info-card li {
            margin: 2px 0;
            color: #4a5568;
        }

        .info-card li::marker {
            color: #667eea;
        }

        .info-card code {
            background: rgba(102, 126, 234, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
            color: #667eea;
            font-size: 12px;
            font-weight: 500;
        }

        .info-card i {
            color: #667eea;
            font-size: 14px;
        }

	        .status-info {
	            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
	            color: white;
	            border-radius: 16px;
	            padding: 12px 14px;
	            margin-bottom: 12px;
	            text-align: center;
	            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.25);
	            position: relative;
	            overflow: hidden;
	        }

        .status-info::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
            50% { transform: translate(-50%, -50%) rotate(180deg); }
        }

	        .status-numbers {
	            display: grid;
	            grid-template-columns: repeat(3, 1fr);
	            gap: 10px;
	            position: relative;
	            z-index: 1;
	        }

	        .status-item {
	            text-align: center;
	            padding: 6px;
	            background: rgba(255, 255, 255, 0.1);
	            border-radius: 8px;
	            backdrop-filter: blur(10px);
	            transition: transform 0.3s ease;
	        }

        .status-item:hover {
            transform: scale(1.05);
        }

	        .status-count {
	            font-size: 18px;
	            font-weight: 700;
	            display: block;
	            margin-bottom: 2px;
	            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
	        }

	        .status-label {
	            font-size: 8px;
	            opacity: 0.9;
	            font-weight: 500;
	            text-transform: uppercase;
	            letter-spacing: 0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Hide scrollbar but keep functionality */
        body, .container {
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE and Edge */
        }

        body::-webkit-scrollbar,
        .container::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }

        /* Loading animation for status counts */
        .status-count.loading {
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Fade in animation for sections */
        .section {
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .section:nth-child(1) { animation-delay: 0.1s; }
        .section:nth-child(2) { animation-delay: 0.2s; }
        .section:nth-child(3) { animation-delay: 0.3s; }
        .section:nth-child(4) { animation-delay: 0.4s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Ripple effect for buttons */
        button {
            position: relative;
            overflow: hidden;
        }

        button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        button:active::after {
            width: 300px;
            height: 300px;
        }

        /* 新增样式: 保护状态卡片 */
        .protection-status-card {
            margin-bottom: 12px;
            border-radius: 10px;
            overflow: hidden;
        }

        .protection-active {
            background: linear-gradient(135deg, #d4f8e8 0%, #abecd6 100%);
            border: 2px solid #51cf66;
            padding: 16px;
            text-align: center;
            border-radius: 10px;
            animation: fadeIn 0.3s ease;
        }

        .protection-active.warning {
            background: linear-gradient(135deg, #fff3bf 0%, #ffe066 100%);
            border-color: #ff922b;
        }

        .protection-active.danger {
            background: linear-gradient(135deg, #ffe0e0 0%, #ffb3b3 100%);
            border-color: #ff6b6b;
        }

        /* 精简版临时保护状态展示 */
        .protection-active.mini {
            padding: 10px 12px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .protection-active.mini > i {
            font-size: 16px;
            color: #2d7a4e;
            flex-shrink: 0;
        }

        .protection-active.warning.mini > i {
            color: #c05621;
        }

        .protection-active.danger.mini > i {
            color: #c53030;
        }

        .protection-mini-text {
            flex: 1;
            font-size: 12px;
            font-weight: 600;
            color: #2d7a4e;
            line-height: 1.2;
        }

        .protection-active.warning .protection-mini-text {
            color: #c05621;
        }

        .protection-active.danger .protection-mini-text {
            color: #c53030;
        }

        .cancel-protection-icon {
            border: none;
            background: transparent;
            padding: 4px;
            min-height: auto;
            cursor: pointer;
            color: #718096;
            flex-shrink: 0;
        }

        .cancel-protection-icon::after {
            display: none;
        }

        .cancel-protection-icon:hover {
            color: #e53e3e;
        }

        .protection-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .protection-header i {
            font-size: 20px;
            color: #2d7a4e;
        }

        .protection-title {
            font-size: 14px;
            font-weight: 600;
            color: #2d7a4e;
        }

        .countdown {
            font-size: 16px;
            font-weight: 700;
            color: #2d7a4e;
            margin: 8px 0;
        }

        .expire-time {
            font-size: 11px;
            color: #4a5568;
            margin-bottom: 12px;
        }

        .quick-actions {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-small {
            padding: 6px 10px;
            font-size: 10px;
            min-height: auto;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* 新增样式: 路径选择器 */
        .url-pattern-selector {
            margin-top: 12px;
        }

        .pattern-option {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            padding: 10px;
            border: 2px solid rgba(102, 126, 234, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .pattern-option:hover {
            background: rgba(102, 126, 234, 0.05);
            border-color: rgba(102, 126, 234, 0.4);
        }

        .pattern-option:has(input[type="radio"]:checked) {
            background: rgba(102, 126, 234, 0.1);
            border-color: #667eea;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
        }

        .pattern-option input[type="radio"] {
            flex-shrink: 0;
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: #667eea;
        }

        .pattern-label {
            font-size: 11px;
            font-weight: 600;
            color: #4a5568;
            min-width: 90px;
            flex-shrink: 0;
        }

        .pattern-protected-indicator {
            width: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #51cf66;
            opacity: 0;
            pointer-events: none;
            position: relative;
        }

        .pattern-protected-indicator.is-protected {
            opacity: 1;
            pointer-events: auto;
            cursor: help;
        }

        .pattern-protected-indicator.is-protected:not([data-tooltip=""]):hover::after {
            content: attr(data-tooltip);
            position: absolute;
            left: 50%;
            top: -8px;
            transform: translate(-50%, -100%);
            white-space: nowrap;
            background: rgba(45, 55, 72, 0.95);
            color: #fff;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 10px;
            line-height: 1;
            z-index: 9999;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
        }

        .pattern-protected-indicator.is-protected:not([data-tooltip=""]):hover::before {
            content: '';
            position: absolute;
            left: 50%;
            top: -8px;
            transform: translate(-50%, -2px);
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid rgba(45, 55, 72, 0.95);
            z-index: 10000;
        }

        .pattern-input {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 6px;
            font-size: 10px;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
            background: white;
            color: #2d3748;
            transition: all 0.3s ease;
        }

        .pattern-input:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .pattern-input[readonly] {
            background: rgba(102, 126, 234, 0.05);
            cursor: default;
        }

        .pattern-input.error {
            border-color: #ff6b6b;
            background: #fff5f5;
        }
    </style>
</head>

	<body>
	    <div class="container">
	        <div class="status-info">
	            <div class="status-numbers">
	                <div class="status-item">
	                    <span class="status-count" id="activeTabsCount">-</span>
	                    <span class="status-label" data-i18n="activeTabs">🟢 Active</span>
                </div>
                <div class="status-item">
                    <span class="status-count" id="discardedTabsCount">-</span>
                    <span class="status-label" data-i18n="discardedTabs">💤 Discarded</span>
                </div>
                <div class="status-item">
                    <span class="status-count" id="totalTabsCount">-</span>
                    <span class="status-label" data-i18n="totalTabs">📑 Total</span>
                </div>
            </div>
        </div>

	        <div class="section">
	            <div class="section-title">
	                <i class="fas fa-bolt"></i>
	                <span data-i18n="quickDiscard">Quick Discard</span>
	            </div>
	            <div class="button-row">
	                <button id="discardOthers" class="secondary">
	                    <i class="fas fa-external-link-alt"></i><span data-i18n="discardOthers">Other Tabs</span>
	                </button>
	                <button id="discardHalfHour">
	                    <i class="fas fa-clock"></i><span data-i18n="discardTabsIdle30Mins">Idle 30min</span>
	                </button>
	            </div>
	        </div>

	        <div class="section">
	            <div class="section-title">
	                <i class="fas fa-shield-alt"></i>
	                <span data-i18n="protectionCurrentTab">Tab Protection</span>
	                <span class="section-subtitle" data-i18n="temporaryProtectionDesc">Protect current tab from being discarded for a specific duration</span>
	            </div>

            <!-- 新增: 保护状态卡片 -->
            <div id="protectionStatusCard" class="protection-status-card">
                <!-- 动态内容由 JS 填充 -->
            </div>

	            <!-- 新增: 路径选择器 -->
	            <div class="url-pattern-selector">
	                <label class="pattern-option">
	                    <input type="radio" name="urlPattern" value="full" />
                    <span class="pattern-label">完整路径</span>
                    <span class="pattern-protected-indicator" data-for="urlPatternFull" data-i18n-title="permanentProtectedTip"><i class="fas fa-shield-alt"></i></span>
                    <input type="text" id="urlPatternFull" class="pattern-input" readonly />
                </label>

                <label class="pattern-option">
                    <input type="radio" name="urlPattern" value="path" checked />
                    <span class="pattern-label">路径通配符</span>
                    <span class="pattern-protected-indicator" data-for="urlPatternPath" data-i18n-title="permanentProtectedTip"><i class="fas fa-shield-alt"></i></span>
                    <input type="text" id="urlPatternPath" class="pattern-input" readonly />
                </label>

                <label class="pattern-option">
                    <input type="radio" name="urlPattern" value="domain" />
                    <span class="pattern-label">域名通配符</span>
                    <span class="pattern-protected-indicator" data-for="urlPatternDomain" data-i18n-title="permanentProtectedTip"><i class="fas fa-shield-alt"></i></span>
                    <input type="text" id="urlPatternDomain" class="pattern-input" readonly />
                </label>

                <label class="pattern-option">
                    <input type="radio" name="urlPattern" value="custom" />
                    <span class="pattern-label">自定义规则</span>
                    <span class="pattern-protected-indicator" data-for="urlPatternCustom" data-i18n-title="permanentProtectedTip"><i class="fas fa-shield-alt"></i></span>
                    <input type="text" id="urlPatternCustom" class="pattern-input" placeholder="输入自定义规则..." />
                </label>
            </div>

            <!-- 新增: 统一的保护按钮 -->
            <div class="button-row" style="grid-template-columns: 1fr 1fr 1fr 1fr; margin-top: 12px;">
                <button id="protect24Hour" class="success">
                    <i class="fas fa-clock"></i><span data-i18n="dontDiscardIn24h">24 Hours</span>
                </button>
                <button id="protect1Week" class="success">
                    <i class="fas fa-calendar-week"></i><span data-i18n="dontDiscardIn1Week">1 Week</span>
                </button>
                <button id="protectPermanent" class="success">
                    <i class="fas fa-infinity"></i><span data-i18n="protectPermanent">Permanent</span>
                </button>
	                <button id="removeProtection" class="danger">
	                    <i class="fas fa-trash"></i><span data-i18n="removeProtection">Remove</span>
	                </button>
	            </div>
	        </div>

	        <div class="section">
	            <div class="section-title">
	                <i class="fas fa-cog"></i>
	                <span data-i18n="autoDiscardSettings">Auto Discard Settings</span>
	            </div>
	            <div class="input-group">
	                <label class="input-label" for="idleLimit" data-i18n="idleTimeLimitDesc">Tabs inactive longer than this will be auto-discarded</label>
	                <input type="number" id="idleLimit" min="1" placeholder="1800" />
	                <span class="input-label input-unit" data-i18n="secondsUnit">seconds</span>
	                <button id="save" class="success">
	                    <i class="fas fa-save"></i><span data-i18n="save">Save</span>
	                </button>
	            </div>
	        </div>

    </div>

    <div id="message"></div>
    <script src="popup.js"></script>
</body>
</html>
